name: docs

on:
  push:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The tt07 tools now build the datasheet with typst, but the tt07 action
      # doesn't install it. Install the version Tiny Tapeout's current action uses.
      - name: Install typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.13.1'

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@tt07
